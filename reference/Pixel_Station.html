<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pixel Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2733;--panel:#fff4dc;--edge:#2a2733;--shade:#d9c9a6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#fff4dc;--panel:#2b2840;--edge:#0f0d18;--shade:#1b1930;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#fff4dc;--panel:#2b2840;--edge:#0f0d18;--shade:#1b1930;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#1b1a24;overflow:hidden;overscroll-behavior:none;font-family:"Pixelify Sans",ui-rounded,"Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
.bar{position:absolute;right:10px;bottom:12px;display:flex;gap:8px}
.tl{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
button{pointer-events:auto;font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:var(--panel);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);border-radius:0;padding:7px 12px;min-width:44px;min-height:40px;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
button:focus-visible{outline:3px solid #f2c230;outline-offset:2px}
.tip{font-size:14px;line-height:1.35;color:var(--ink);background:var(--panel);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);padding:8px 11px;max-width:260px;transition:opacity .5s}
.tip.hide{opacity:0}
#load{position:absolute;inset:0;display:grid;place-items:center;color:#fff4dc;font-size:18px;background:#1b1a24}
@media (prefers-reduced-motion: reduce){.tip{transition:none}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div class="tl"><div class="tip" id="tip">Tap to walk somewhere. Hold to steer. Pinch to zoom.</div><button id="tod" aria-label="Switch to night">Night</button></div>
<div class="bar"><button id="zout" aria-label="Zoom out">−</button><button id="zin" aria-label="Zoom in">+</button></div>
<div id="load">Building the city…</div>
</div>
<script>
"use strict";
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
/* ---------- colour helpers ---------- */
const rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const CC={};function C(h){let v=CC[h];if(v===undefined){const a=rgb(h);v=CC[h]=(0xff000000|a[2]<<16|a[1]<<8|a[0])>>>0}return v}
const CA=(h,a)=>{const v=rgb(h);return((a<<24)|v[2]<<16|v[1]<<8|v[0])>>>0};
const mix=(h,h2,k)=>{const a=rgb(h),b=rgb(h2);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('')};
const dk=(h,k)=>mix(h,'#2a1f45',k),lt=(h,k)=>mix(h,'#fff8e0',k);
const PC={};const pal=c=>PC[c]||(PC[c]={t:c,l:dk(c,.18),r:dk(c,.36),o:dk(c,.7),h:lt(c,.5),m:lt(dk(c,.18),.3)});
/* ---------- pixel rasteriser ---------- */
let T=null,EMIT=0,NIGHT=false,OFX=0,OFY=0;
const WS=(x,y,z)=>[(x-y)*8,(x+y)*4-z*8];
const PW=(x,y,z)=>{x+=OFX;y+=OFY;return[(x-y)*8-T.ox,(x+y)*4-z*8-T.oy]};
function px(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=T.w||y>=T.h)return;const i=y*T.w+x;T.buf[i]=c;T.em[i]=EMIT}
function fill(p,h,h2){const c=C(h),gl=h2==='glass',c2=h2&&!gl?C(h2):0;let y0=1e9,y1=-1e9;for(const q of p){if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1]}
 y0=Math.max(0,Math.ceil(y0-.5));y1=Math.min(T.h-1,Math.floor(y1-.5));const n=p.length,W=T.w,buf=T.buf,em=T.em;
 for(let y=y0;y<=y1;y++){const s=y+.5;let l=1e9,r=-1e9;for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];if((a[1]<=s)!==(b[1]<=s)){const x=a[0]+(s-a[1])/(b[1]-a[1])*(b[0]-a[0]);if(x<l)l=x;if(x>r)r=x}}
  if(l>r)continue;const xa=Math.max(0,Math.ceil(l-.5)),xb=Math.min(W-1,Math.floor(r-.5)),row=y*W;
  for(let x=xa;x<=xb;x++){const odd=(x+y)&1;if(gl&&odd)continue;buf[row+x]=c2&&odd?c2:c;em[row+x]=EMIT}}}
function line(a,b,h){let x0=Math.round(a[0]),y0=Math.round(a[1]);const x1=Math.round(b[0]),y1=Math.round(b[1]),c=C(h),dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
 for(let k=0;k<4000;k++){px(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
const fq=(p,h,h2)=>fill(p.map(q=>PW(q[0],q[1],q[2])),h,h2),lw=(a,b,h)=>line(PW(a[0],a[1],a[2]),PW(b[0],b[1],b[2]),h);
const qy=(x0,x1,y,z0,z1,h,h2)=>fq([[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],h,h2);
const qx=(x,y0,y1,z0,z1,h,h2)=>fq([[x,y0,z0],[x,y1,z0],[x,y1,z1],[x,y0,z1]],h,h2);
const qz=(x0,x1,y0,y1,z,h,h2)=>fq([[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]],h,h2);
function outline(x,y,z,w,d,h,c){const p=pal(c),s=[[x,y,z+h],[x+w,y,z+h],[x+w,y,z],[x+w,y+d,z],[x,y+d,z],[x,y+d,z+h]];
 for(let i=0;i<6;i++)lw(s[i],s[(i+1)%6],p.o);lw([x+w,y+d,z+h],[x,y+d,z+h],p.h);lw([x+w,y+d,z+h],[x+w,y,z+h],p.h);if(h>.3)lw([x+w,y+d,z+h],[x+w,y+d,z],p.m)}
function box(x,y,z,w,d,h,c,o){o=o||{};const p=pal(c);
 qx(x+w,y,y+d,z,z+h,o.r||p.r,o.r2);qy(x,x+w,y+d,z,z+h,o.l||p.l,o.l2);qz(x,x+w,y,y+d,z+h,o.t||p.t,o.t2);
 if(o.ol!==false)outline(x,y,z,w,d,h,c)}
const lit=f=>{const e=EMIT;EMIT=1;f();EMIT=e};
function tiles(x0,x1,y0,y1,z,a,b,s){let i=0;for(let x=x0;x<x1-1e-6;x+=s,i++){let j=0;for(let y=y0;y<y1-1e-6;y+=s,j++)qz(x,Math.min(x+s,x1),y,Math.min(y+s,y1),z,(i+j)%2?a:b)}}
function darken(){const b=T.buf,e=T.em;for(let i=0;i<b.length;i++){const c=b[i],a=c>>>24;if(!a||e[i])continue;const r=c&255,g=c>>8&255,bl=c>>16&255;b[i]=((a<<24)|((bl*.45+36)|0)<<16|((g*.33+14)|0)<<8|((r*.28+12)|0))>>>0}}
function outlineT(col){const w=T.w,h=T.h,b=T.buf,o=b.slice(),c=C(col);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(o[i]>>>24)continue;
 if((x>0&&o[i-1]>>>24===255)||(x<w-1&&o[i+1]>>>24===255)||(y>0&&o[i-w]>>>24===255)||(y<h-1&&o[i+w]>>>24===255))b[i]=c}}
function render(sb,fn,n,ol){const pad=3,x0=Math.floor(sb[0])-pad,y0=Math.floor(sb[1])-pad,w=Math.ceil(sb[2])-x0+pad,h=Math.ceil(sb[3])-y0+pad;
 const id=new ImageData(w,h);T={buf:new Uint32Array(id.data.buffer),em:new Uint8Array(w*h),w,h,ox:x0,oy:y0};NIGHT=!!n;EMIT=0;fn();if(n)darken();if(ol)outlineT(n?ol[1]:ol[0]);
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').putImageData(id,0,0);return{c,x:x0,y:y0}}
function screenBox(b){let a=1e9,c=1e9,e=-1e9,f=-1e9;for(const x of[b[0],b[3]])for(const y of[b[1],b[4]])for(const z of[b[2],b[5]]){const s=WS(x,y,z);if(s[0]<a)a=s[0];if(s[1]<c)c=s[1];if(s[0]>e)e=s[0];if(s[1]>f)f=s[1]}return[a,c,e,f]}
/* ---------- random ---------- */
let seed=20261110;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;const pick=a=>a[R()*a.length|0];
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
/* ---------- walk grid ---------- */
const GN=96,blocked=new Uint8Array(GN*GN);
function setRect(x0,y0,x1,y1,v){for(let gy=Math.max(0,Math.floor(y0*2));gy<Math.min(GN,Math.ceil(y1*2));gy++)for(let gx=Math.max(0,Math.floor(x0*2));gx<Math.min(GN,Math.ceil(x1*2));gx++)blocked[gy*GN+gx]=v}
const blockRect=(a,b,c,d)=>setRect(a,b,c,d,1),freeRect=(a,b,c,d)=>setRect(a,b,c,d,0);
const isBlocked=(x,y)=>x<.25||y<.25||x>47.75||y>47.75||blocked[(Math.floor(y*2))*GN+Math.floor(x*2)]===1;
function heightAt(x,y){if(x>=13&&x<35&&((y>=17&&y<19)||(y>=20.6&&y<23.4)||(y>=25&&y<27)))return .5;return 0}
/* ---------- world objects ---------- */
const OBJ=[],POOLS=[];
function add(b,draw,o){o=o||{};const off=o.off||[0,0];
 const B=[b[0]+off[0],b[1]+off[1],b[2],b[3]+off[0],b[4]+off[1],b[5]];
 const v=o.vb||[b[0]-.45,b[1]-.45,b[2],b[3]+.45,b[4]+.45,b[5]+.4];
 const vb=[v[0]+off[0],v[1]+off[1],v[2],v[3]+off[0],v[4]+off[1],v[5]];
 const ob={B,draw,off,spr:[null,null],sb:screenBox(vb),k:B[0]+B[3]+B[1]+B[4]};
 if(o.block!==false&&B[2]<.9)blockRect(B[0],B[1],B[3],B[4]);
 OBJ.push(ob);return ob}
function sprite(ob,n){let s=ob.spr[n];if(!s){OFX=ob.off[0];OFY=ob.off[1];s=ob.spr[n]=render(ob.sb,ob.draw,n,ob.ol);OFX=OFY=0}return s}
const dynOb=(b,draw,ol)=>({sb:screenBox(b),draw,off:[0,0],spr:[null,null],ol});
/* ---------- props ---------- */
function glassWin(x0,x1,y,z0,z1,on){if(NIGHT&&on!==false){EMIT=1;qy(x0,x1,y,z0,z1,'#ffd98a','#f4c870');EMIT=0}else if(NIGHT)qy(x0,x1,y,z0,z1,'#1e2438');else qy(x0,x1,y,z0,z1,'#7fb6d0','#9fcbe0');lw([x0,y,z0],[x1,y,z0],'#5b5466')}
function glassWinX(x,y0,y1,z0,z1,on){if(NIGHT&&on!==false){EMIT=1;qx(x,y0,y1,z0,z1,'#f4c870','#e8b860');EMIT=0}else if(NIGHT)qx(x,y0,y1,z0,z1,'#1a2032');else qx(x,y0,y1,z0,z1,'#6aa2bd','#86bcd2')}
function bench(x,y){box(x,y,.85,1.2,.06,.35,'#b07444',{ol:false});box(x,y,.85,1.2,.4,.08,'#b07444');lw([x+.1,y+.4,.5],[x+.1,y+.4,.85],'#333');lw([x+1.1,y+.4,.5],[x+1.1,y+.4,.85],'#333')}
function benchG(x,y){box(x,y,.35,1.2,.06,.35,'#b07444',{ol:false});box(x,y,.35,1.2,.4,.08,'#b07444');lw([x+.1,y+.4,0],[x+.1,y+.4,.35],'#333');lw([x+1.1,y+.4,0],[x+1.1,y+.4,.35],'#333')}
function lampPost(x,y,z){box(x,y,z,.12,.12,2.8,'#4d5d68',{ol:false});box(x-.25,y-.05,z+2.8,.55,.22,.12,'#3d4a54');if(NIGHT)lit(()=>lw([x-.2,y+.17,z+2.79],[x+.25,y+.17,z+2.79],'#fff2c4'))}
function lamp(x,y,z,off){off=off||[0,0];add([x,y,z,x+.12,y+.12,z+2.92],()=>lampPost(x,y,z),{off,vb:[x-.4,y-.3,z,x+.5,y+.4,z+3.1]});POOLS.push([x+off[0],y+off[1],z,16,8])}
function tree(x,y,z,off){off=off||[0,0];
 add([x-.1,y-.1,z,x+.1,y+.1,z+1],()=>box(x-.1,y-.1,z,.2,.2,1.1,'#6b4a2f',{ol:false}),{off});
 add([x-.65,y-.65,z+1,x+.65,y+.65,z+2.4],()=>{box(x-.65,y-.65,z+1,1.3,1.3,.9,'#4f9a45',{t2:'#5aa84f'});box(x-.4,y-.4,z+1.9,.8,.8,.5,'#62b356',{t2:'#72c463'})},{off,block:false})}
function bin(x,y,z,off){add([x,y,z,x+.3,y+.3,z+.5],()=>box(x,y,z,.3,.3,.5,'#56636b'),{off})}
/* ---------- people ---------- */
const SH=['#3b5bdb','#e8590c','#2f9e44','#7048e8','#d6336c','#1098ad','#f5f5f5','#c92a2a','#5c940d'],PA=['#2b2f3a','#4a3b2a','#3d4f6b','#5c5f66'],SK=['#f1c7a1','#d9a074','#a9714a','#6b4630'],HA=['#2a1c14','#5b3a22','#e0b85a','#1a1a1a','#b0b0b0','#c2552d'];
const app=()=>({sh:pick(SH),pa:pick(PA),sk:pick(SK),ha:pick(HA),bag:R()<.35?pick(['#8a5a3a','#222222','#c2410c']):0});
function person(p,f){const s=PW(p.x,p.y,p.z),X=Math.round(s[0]),Y=Math.round(s[1]);
 const pa=C(p.pa),sh=C(p.sh),sd=C(dk(p.sh,.3)),sk=C(p.sk),ha=C(p.ha),L=p.v<0,shd=CA('#2a1f45',90);
 px(X-1,Y,shd);px(X,Y,shd);px(X+1,Y,shd);
 if(f===0){px(X-1,Y-1,pa);px(X+1,Y-1,pa);px(X-1,Y-2,pa);px(X,Y-2,pa);px(X+1,Y-2,pa)}
 else if(f===1){px(X-1,Y-1,pa);px(X,Y-1,pa);px(X-1,Y-2,pa);px(X,Y-2,pa);px(X+1,Y-2,pa)}
 else{px(X,Y-1,pa);px(X+1,Y-1,pa);px(X-1,Y-2,pa);px(X,Y-2,pa);px(X+1,Y-2,pa)}
 for(let yy=Y-5;yy<=Y-3;yy++)for(let xx=X-1;xx<=X+1;xx++)px(xx,yy,xx===X+1?sd:sh);
 if(f===1)px(L?X+2:X-2,Y-4,L?sd:sh);if(f===2)px(L?X-2:X+2,Y-4,L?sh:sd);
 const hx=L?X-1:X;px(hx,Y-6,sk);px(hx+1,Y-6,sk);px(hx,Y-7,sk);px(hx+1,Y-7,sk);px(hx,Y-8,ha);px(hx+1,Y-8,ha);px(L?hx+1:hx,Y-7,ha);
 if(p.cap){px(L?hx-1:hx+2,Y-7,ha);px(hx,Y-9,ha);px(hx+1,Y-9,ha)}
 if(p.bag){px(L?X-2:X+2,Y-3,C(p.bag));px(L?X-2:X+2,Y-4,C(p.bag))}}
const PSB=[-4,-12,4,2];
function pset(a,ol){return{a,ol,c:{}}}
function pspr(S,face,f,n){const k=n*10+face*3+f;let s=S.c[k];if(!s)s=S.c[k]=render(PSB,()=>person(Object.assign({x:0,y:0,z:0,v:face?-1:1},S.a),f),n,S.ol);return s}
function npc(x,y,z,off){const p=Object.assign({x,y,z,v:R()<.5?1:-1},app());add([x-.15,y-.15,z,x+.15,y+.15,z+1],()=>person(p,0),{off,vb:[x-.6,y-.6,z,x+.6,y+.6,z+1.6]})}
/* ---------- buildings ---------- */
const STY=[
 {wall:'#b5654a',win:'#3a4560',win2:'#4a5878',roof:'#7a6f6a',awn:'#2f6f5f',ws:1,tower:1},
 {wall:'#e9dcc0',win:'#7fb6d0',win2:'#9fcbe0',roof:'#b9ad95',awn:'#d63a3a',ws:1},
 {wall:'#b8b6ae',win:'#5f7f96',win2:'#6f8fa6',roof:'#8f8d86',awn:'#e8a33a',ws:.9},
 {wall:'#8fc9b8',win:'#3f6f7f',win2:'#4f7f8f',roof:'#6f9f90',awn:'#f2c230',ws:1.1},
 {wall:'#e8b4a0',win:'#4a5878',win2:'#5a6888',roof:'#b98a7a',awn:'#3b5bdb',ws:1},
 {wall:'#c9a66b',win:'#3a4560',win2:'#4a5878',roof:'#8a7a5a',awn:'#7048e8',ws:1,tower:1},
 {glass:1,wall:'#6f9fbf',win:'#8fc0da',win2:'#a8d2e6',roof:'#5d6f7f'}];
function building(x,y,w,d,h,S,sd){const r=rng(sd),rp=rng(sd+77);
 box(x,y,0,w,d,h,S.wall,{t:S.roof});
 const fy=y+d,fx=x+w;
 if(S.glass){
  if(NIGHT){qy(x+.1,fx-.1,fy,.9,h-.1,'#1e2840');qx(fx,y+.1,fy-.1,.9,h-.1,'#1a2236')}else{qy(x+.1,fx-.1,fy,.9,h-.1,S.win,S.win2);qx(fx,y+.1,fy-.1,.9,h-.1,dk(S.win,.15),dk(S.win2,.15))}
  for(let f=1;f<h;f++){if(NIGHT){for(let sx=x+.15;sx<fx-.6;sx+=.9)if(r()<.5)lit(()=>qy(sx,sx+.75,fy,f+.15,f+.85,'#ffd98a','#f4c870'));for(let sy=y+.15;sy<fy-.6;sy+=.9)if(r()<.5)lit(()=>qx(fx,sy,sy+.75,f+.15,f+.85,'#f4c870','#e8b860'))}
   lw([x,fy,f],[fx,fy,f],dk(S.wall,.45));lw([fx,y,f],[fx,fy,f],dk(S.wall,.55))}
 }else{
  for(let f=1;f<h;f++){for(let xi=x+.35;xi+.45<=fx-.2;xi+=S.ws)glassWin2(xi,xi+.45,fy,f+.2,f+.75,S,r);
   for(let yi=y+.35;yi+.45<=fy-.2;yi+=S.ws)glassWinX2(fx,yi,yi+.45,f+.2,f+.75,S,r)}
 }
 // shopfront
 if(NIGHT){lit(()=>qy(x+.25,fx-.25,fy,.1,.8,'#ffe3a8','#f4cf86'))}else qy(x+.25,fx-.25,fy,.1,.8,'#7fb6d0','#9fcbe0');
 qy(x+.45,x+.8,fy,0,.8,'#2b3a44');
 if(S.awn){box(x+.15,fy,.82,w-.3,.35,.1,S.awn,{ol:false});for(let sx=x+.15;sx<fx-.2;sx+=.5)qz(sx,Math.min(sx+.25,fx-.15),fy,fy+.35,.92,'#f4f0e8');lw([x+.15,fy+.35,.82],[fx-.15,fy+.35,.82],dk(S.awn,.5))}
 // roof
 qz(x+.14,fx-.14,y+.14,fy-.14,h,dk(S.roof,.14));
 if(rp()<.7)box(x+w*.25,y+d*.3,h,.8,.6,.45,'#b8bcc0');
