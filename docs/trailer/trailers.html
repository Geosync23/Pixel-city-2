<title>Maple Bay Trailers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root { --bg: #1b1a24; --fg: #fff4dc; --mute: #c9bfa8; --acc: #f2c230; --line: #2a2733; color-scheme: dark; }
  body { background: var(--bg); color: var(--fg); font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 22px; margin: 8px 0 4px; text-wrap: balance; }
  h2 { font-size: 18px; margin: 28px 0 8px; color: var(--acc); }
  p { margin: 4px 0 10px; color: var(--mute); font-size: 14px; line-height: 1.4; }
  video { width: 100%; height: auto; display: block; background: #000; border: 2px solid var(--line); box-sizing: border-box; }
</style>
<main>
  <h1>Maple Bay: two trailer rough cuts</h1>
  <p>45 seconds each, wide. Rough cuts: complete in length, order, music and captions, not yet polished. Best watched with the phone held sideways and the sound on.</p>
  <h2>Trailer A: The City Wakes Up</h2>
  <video src="trailer_a_rough.mp4" controls playsinline preload="metadata"></video>
  <h2>Trailer B: Open Every Door, through a week</h2>
  <video src="trailer_b_rough.mp4" controls playsinline preload="metadata"></video>
</main>
